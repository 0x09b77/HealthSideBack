openapi: 3.1.0
info:
  title: Healthside API
  version: 0.1.0
  description: >
    MVP backend for Healthside — privacy-first storage of medical lab results
    (PDF/photo) bound to a user. Auth uses a short-lived access token (JWT,
    ~15 min) plus a long-lived refresh token (~30 days).

servers:
  - url: http://127.0.0.1:8080
    description: Local development

tags:
  - name: Auth
    description: Registration, login, token refresh and logout
  - name: User
    description: Current user profile
  - name: Lab results
    description: Upload, list, download and delete lab-result files

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and receive an access + refresh token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Token pair issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new token pair (rotates the refresh token)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New token pair issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke a refresh token (idempotent)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Token revoked (or already absent)

  /me:
    get:
      tags: [User]
      summary: Profile of the authenticated user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /lab-results:
    post:
      tags: [Lab results]
      summary: Upload a lab-result file
      description: >
        Accepts PDF, JPEG, PNG or HEIC (validated by magic bytes, not by the
        filename or Content-Type). Max 20 MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                label:
                  type: string
                  description: Optional human label, e.g. "Helix, April 2026"
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabResultResponse'
        '400':
          description: Empty or malformed file
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: File exceeds the 20 MB limit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: Unsupported file type
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [Lab results]
      summary: List the caller's own lab results (newest first)
      responses:
        '200':
          description: List of metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LabResultResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /lab-results/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Lab results]
      summary: Download a lab-result file (owner only)
      responses:
        '200':
          description: The file, served as an attachment
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Lab results]
      summary: Delete a lab-result file and its metadata (owner only)
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  security:
    - bearerAuth: []

  schemas:
    AuthRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: demo@healthside.app
        password:
          type: string
          minLength: 8
          maxLength: 128
          example: supersecret
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token (~15 min)
        refreshToken:
          type: string
          description: Opaque refresh token (~30 days)
    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
          nullable: true
    LabResultResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        originalFilename:
          type: string
        mimeType:
          type: string
          example: application/pdf
        fileSize:
          type: integer
          description: Size in bytes
        checksumSha256:
          type: string
        label:
          type: string
          nullable: true
        uploadedAt:
          type: string
          format: date-time
          nullable: true
    Error:
      type: object
      properties:
        error:
          type: boolean
        reason:
          type: string

  responses:
    Unauthorized:
      description: Missing or expired access token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Resource belongs to another user
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

security:
  - bearerAuth: []
