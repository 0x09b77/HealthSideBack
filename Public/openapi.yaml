openapi: 3.1.0
info:
  title: Healthside API
  version: 0.1.0
  description: >
    MVP backend for Healthside — privacy-first storage of medical lab results
    (PDF/photo) bound to a user. Auth uses a short-lived access token (JWT,
    ~15 min) plus a long-lived refresh token (~30 days).

servers:
  - url: http://127.0.0.1:8080
    description: Local development

tags:
  - name: Auth
    description: Registration, login, token refresh and logout
  - name: User
    description: Current user profile
  - name: Lab results
    description: Upload, list, download and delete lab-result files
  - name: Documents
    description: Extraction status and parsed document envelopes

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and receive an access + refresh token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Token pair issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new token pair (rotates the refresh token)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New token pair issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke a refresh token (idempotent)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Token revoked (or already absent)

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change the signed-in user's password
      description: >
        Verifies the current password, stores the new one, and revokes every
        existing refresh token (other devices are signed out). Returns a fresh
        token pair so the calling device stays signed in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed; new token pair issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: New password fails validation, or is the same as the current one
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Missing/expired access token, or the current password is wrong
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /me:
    get:
      tags: [User]
      summary: Profile of the authenticated user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /lab-results:
    post:
      tags: [Lab results]
      summary: Upload a lab-result file
      description: >
        Accepts PDF, JPEG, PNG or HEIC (validated by magic bytes, not by the
        filename or Content-Type). Max 20 MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                label:
                  type: string
                  description: Optional human label, e.g. "Helix, April 2026"
      responses:
        '202':
          description: Accepted — file stored, queued for background extraction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadAcceptedResponse'
        '400':
          description: Empty or malformed file
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Duplicate — this file (by checksum) was already uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: File exceeds the 20 MB limit, or image resolution exceeds 50 MP
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: Unsupported file type
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [Lab results]
      summary: List the caller's own lab results (newest first)
      responses:
        '200':
          description: List of metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LabResultResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /lab-results/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Lab results]
      summary: Download a lab-result file (owner only)
      responses:
        '200':
          description: The file, served as an attachment
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Lab results]
      summary: Delete a lab-result file and its metadata (owner only)
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /documents:
    get:
      tags: [Documents]
      summary: The caller's processing/extraction feed (newest first)
      responses:
        '200':
          description: List of documents with status and (when done) the envelope
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentView'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /documents/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The document id returned at upload (== lab-result id)
    get:
      tags: [Documents]
      summary: Extraction status and (when done) the parsed envelope (owner only)
      responses:
        '200':
          description: Document status and envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  security:
    - bearerAuth: []

  schemas:
    AuthRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: demo@healthside.app
        password:
          type: string
          minLength: 8
          maxLength: 128
          example: supersecret
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token (~15 min)
        refreshToken:
          type: string
          description: Opaque refresh token (~30 days)
    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
          nullable: true
    LabResultResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        originalFilename:
          type: string
        mimeType:
          type: string
          example: application/pdf
        fileSize:
          type: integer
          description: Size in bytes
        checksumSha256:
          type: string
        label:
          type: string
          nullable: true
        parseStatus:
          $ref: '#/components/schemas/ParseStatus'
        uploadedAt:
          type: string
          format: date-time
          nullable: true
    ParseStatus:
      type: string
      enum: [pending, processing, done, failed]
      description: Extraction pipeline status of the file
    UploadAcceptedResponse:
      type: object
      properties:
        documentId:
          type: string
          format: uuid
          description: Poll GET /documents/{id} with this
        status:
          $ref: '#/components/schemas/ParseStatus'
    DocumentView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ParseStatus'
        originalFilename:
          type: string
        mimeType:
          type: string
        fileSize:
          type: integer
        label:
          type: string
          nullable: true
        documentType:
          type: string
          enum: [lab_panel, imaging_report, consult_note, other]
          nullable: true
          description: null until extraction is done
        reportDate:
          type: string
          format: date
          nullable: true
        provider:
          type: string
          nullable: true
        summary:
          type: string
          nullable: true
        diagnosis:
          type: string
          nullable: true
        payloadJson:
          type: object
          nullable: true
          description: Extraction envelope; null until done
        uploadedAt:
          type: string
          format: date-time
          nullable: true
    Error:
      type: object
      properties:
        error:
          type: boolean
        reason:
          type: string

  responses:
    Unauthorized:
      description: Missing or expired access token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Resource belongs to another user
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Rate limit exceeded — retry after the period in the Retry-After header
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

security:
  - bearerAuth: []
